<style>

.qs-group{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.qs-group button{padding:3px 8px;background:#0f3460;border:1px solid #1a4a7a;border-radius:3px;color:#aaa;cursor:pointer;font-size:11px}
.qs-group button:hover,.qs-group button.active{background:#e94560;color:#fff;border-color:#e94560}
.flip-section{display:flex;flex-direction:column;gap:6px}

.tool-table td input{width:100%;padding:2px 4px;background:transparent;border:1px solid transparent;color:#e0e0e0;font-size:11px;text-align:center}
.tool-table td input:focus{border-color:#e94560;background:#0a1628}
.viewport{flex:1;position:relative;background:#0a0a1a;overflow:hidden}
.vp-label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.3);font-size:12px;pointer-events:none;z-index:10}
.vp-pos{position:absolute;bottom:36px;left:12px;color:rgba(255,255,255,0.5);font-size:12px;font-family:monospace;pointer-events:none;z-index:10;background:rgba(0,0,0,0.5);padding:4px 8px;border-radius:4px}
.vp-btns{position:absolute;top:12px;right:12px;z-index:10;display:flex;gap:4px}
.vp-btns button{width:32px;height:32px;border-radius:4px;border:1px solid #1a4a7a;background:#0f3460;color:#ccc;cursor:pointer;font-size:14px;font-weight:700;transition:all .2s}
.vp-btns button:hover{background:#e94560;color:#fff;border-color:#e94560}
.vp-toggle{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:8px}
.vp-toggle button{padding:6px 14px;border:1px solid #1a4a7a;border-radius:4px;background:#0f3460;color:#ccc;cursor:pointer;font-size:12px;transition:all .2s}
.vp-toggle button:hover{background:#e94560;color:#fff;border-color:#e94560}
.nc-editor{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:100px;border-top:1px solid #0f3460}.nc-editor-header{font-size:12px;color:#e94560;padding:6px 14px;font-weight:600;border-bottom:1px solid #1a2744;flex-shrink:0}.nc-editor-body{flex:1;overflow:hidden auto;font-family:"Cascadia Code","Fira Code","Consolas",monospace;font-size:11px;line-height:1.6;padding:4px 0;background:#0a0a18;max-width:100%}.nc-editor-line{display:flex;padding:0 8px;transition:background .1s;width:100%;min-width:0}.nc-editor-line:hover{background:rgba(233,69,96,0.08)}.nc-editor-line.active{background:rgba(233,69,96,0.2);border-left:3px solid #e94560}.nc-editor-line .line-num{width:38px;text-align:right;color:#555;padding-right:8px;user-select:none;flex-shrink:0}.nc-editor-line.active .line-num{color:#e94560}.nc-editor-line .line-code{color:#888;white-space:pre;overflow:hidden;text-overflow:ellipsis;max-width:100%;flex-shrink:1;min-width:0}.nc-editor-line.active .line-code{color:#e0e0e0}.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,10,26,0.85);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:100}.about-overlay{z-index:200;background:rgba(10,10,26,0.9);backdrop-filter:blur(4px)}.about-box{background:linear-gradient(145deg,#1a2744,#16213e);border:1px solid rgba(233,69,96,0.3);border-radius:16px;padding:44px 52px;text-align:center;max-width:380px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5)}.about-box::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:linear-gradient(90deg,transparent,#e94560,transparent);border-radius:2px}.about-logo{font-size:36px;font-weight:800;color:#e94560;margin-bottom:4px;letter-spacing:2px}.about-version{font-size:13px;color:#555;margin-bottom:20px;letter-spacing:1px}.about-divider{width:40px;height:2px;background:linear-gradient(90deg,transparent,#e94560);margin:0 auto 20px;border-radius:2px}.about-author{font-size:16px;color:#e0e0e0;margin-bottom:6px;font-weight:500}.about-link2{margin-top:16px}.about-link2 a{display:inline-flex;align-items:center;gap:6px;color:#e94560;text-decoration:none;font-size:13px;padding:8px 20px;border:1px solid rgba(233,69,96,0.3);border-radius:8px;transition:all .2s}.about-link2 a:hover{background:rgba(233,69,96,0.1);border-color:#e94560;text-decoration:none}.about-desc{font-size:11px;color:#555;margin-top:20px}.about-close{position:absolute;top:12px;right:16px;width:28px;height:28px;border-radius:50%;color:#666;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .2s;background:none;border:none;line-height:1}.about-close:hover{color:#e94560;background:rgba(233,69,96,0.1)}
.overlay.show{display:flex}
.spin{width:40px;height:40px;border:3px solid #1a4a7a;border-top-color:#e94560;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ol-text{color:#e0e0e0;font-size:14px;margin-top:12px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style></head><body><div id="app">
<div class="header"><div class="logo">NCraft</div><div class="subtitle">智能板材加工模拟系统</div><div class="header-right"><a class="about-link" id="aboutLink" href="javascript:void(0)">关于</a></div></div>
<div class="main">
<div class="left-panel"><div class="left-panel-resize" id="leftPanelResize"></div>
<div class="panel-section"><h3>文件控制</h3>
<label class="file-btn" id="fileLabel">📁 选择NC文件<input type="file" id="fileInput" accept=".nc,.txt"></label>
<div class="file-info" id="fileInfo"></div>
<div class="btn-group" style="margin-top:8px">
<button class="btn btn-primary btn-sm" id="btnStart" disabled>▶ 开始</button>
<button class="btn btn-secondary btn-sm" id="btnPause" disabled>⏸ 暂停</button>
<button class="btn btn-secondary btn-sm" id="btnStop" disabled>⏹ 停止</button>
</div>
<div class="btn-group" style="margin-top:6px">
<button class="btn btn-secondary btn-sm" id="btnStepFwd" disabled>⏭ 单步</button>
<button class="btn btn-secondary btn-sm" id="btnStepBack" disabled>⏮ 回退</button>
</div>
</div>
<div class="panel-section"><h3>速度控制</h3>
<div class="speed-control"><label><span>速度</span><span id="speedValue">1.0x</span></label>
<input type="range" id="speedSlider" min="0.1" max="5.0" step="0.1" value="1.0"></div>
<div class="speed-presets">
<button class="speed-btn" data-speed="0.25">0.25x</button>
<button class="speed-btn" data-speed="0.5">0.5x</button>
<button class="speed-btn active" data-speed="1.0">1x</button>
<button class="speed-btn" data-speed="2.0">2x</button>
<button class="speed-btn" data-speed="5.0">5x</button>
</div>
</div>
<div class="panel-section"><h3>进度</h3>
<div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="progress-text" id="progressText">0 / 0 (0%)</div></div>
<div class="info-line"><span class="label">总行数</span><span class="value" id="totalLines">0</span></div>
<div class="info-line"><span class="label">当前行</span><span class="value" id="currentLine">-</span></div>
<div class="info-line"><span class="label">当前刀具</span><span class="value" id="currentTool">T0 (--mm)</span></div>
<div class="info-line"><span class="label">当前位置</span><span class="value" id="currentPos">X0 Y0 Z0</span></div>
</div>
<div class="nc-editor"><div class="nc-editor-header">NC代码</div><div class="nc-editor-body" id="ncEditorBody"><div style="padding:20px;text-align:center;color:#555;font-size:12px">请选择NC文件</div></div></div>
</div>
<div class="viewport" id="viewport">
<div class="vp-label">拖动旋转 滚轮缩放 右键平移</div>
<div class="vp-pos" id="viewportPos"></div>
<div class="vp-btns"><button id="btnResetView" title="复位视角">R</button><button id="btnTopView" title="俯视图">T</button></div><div class="vp-toggle"><button id="btnToggleBoard">隐藏板件</button><button id="btnTogglePaths">隐藏刀路</button></div>
<div class="overlay" id="loadingOverlay"><div class="spin"></div><div class="ol-text" id="loadingText">处理中...</div></div>
<div class="overlay about-overlay" id="aboutOverlay"><div class="about-box"><div class="about-close" id="aboutClose">&times;</div><div class="about-logo">NCraft</div><div class="about-version">v1.1.18</div><div class="about-divider"></div><div class="about-author">作者：老鱼</div><div class="about-link2"><a href="https://gitee.com/ixujun/NCraft" target="_blank">前往 Gitee 项目主页</a></div><div class="about-desc">智能板材加工NC路径在线模拟系统</div></div></div>
</div>
<div class="right-panel">
<div class="panel-section"><h3>板件设置</h3>
<div class="form-row"><div class="form-group" style="flex:1"><label>宽度(mm)</label><input type="number" id="boardWidth" value="1220" min="100" max="3000" step="1"></div>
<div style="display:flex;align-items:flex-end;padding:0 4px;padding-bottom:5px"><button id="btnSwapWH" type="button" style="width:30px;height:30px;border-radius:6px;border:1px solid #1a4a7a;background:#0f3460;color:#e94560;cursor:pointer;font-size:16px;font-weight:700;transition:all .2s;display:flex;align-items:center;justify-content:center" title="互换宽高">⇄</button></div>
<div class="form-group" style="flex:1"><label>长度(mm)</label><input type="number" id="boardLength" value="2440" min="100" max="3000" step="1"></div></div>
<div class="form-group"><label>厚度(mm)</label><input type="number" id="boardThickness" value="18" min="1" max="50" step="0.5">
</div>
<div class="form-group"><label style="font-size:12px;color:#aaa">快捷尺寸</label>
<div class="qs-group"><button class="active" data-w="1220" data-l="2440">4x8尺(1220x2440)</button><button data-w="1220" data-l="2745">4x9尺(1220x2745)</button></div></div>
<div class="form-group"><label style="font-size:12px;color:#aaa">快捷厚度</label>
<div class="qs-group" id="thickGroup"><button class="active" data-t="18">18mm</button><button data-t="9">9mm</button><button data-t="5">5mm</button><button data-t="20">20mm</button></div></div>
<div class="form-group"><label>纹理方向</label><div class="tt-group"><button class="active" data-dir="vertical">竖纹</button><button data-dir="horizontal">横纹</button></div></div>
<div class="form-group"><label>Z轴基点</label><input type="number" id="zBase" value="0.0" step="0.01">
<div style="font-size:11px;color:#666">NC坐标Z值偏移基准</div></div>
<button class="btn btn-secondary btn-sm" id="btnApplyBoard" style="margin-top:6px;width:100%">应用板件设置</button>
</div>
<div class="panel-section"><h3>刀具设置</h3>
<div class="form-group"><label>默认刀具直径(mm)</label><input type="number" id="defaultToolDia" value="6" min="1" max="50" step="0.5"></div>
<div class="form-group"><label style="font-size:12px;color:#aaa">刀具直径(T1-T12)</label>
<div style="max-height:200px;overflow-y:auto"><table class="tool-table"><thead><tr><th style="width:28px">刀号</th><th>刀头直径</th><th style="width:28px">刀号</th><th>刀头直径</th></tr></thead><tbody>
<tr><td>T1</td><td><input class="tdia" data-t="1" type="number" value="5" step="0.5" min="1"></td><td>T7</td><td><input class="tdia" data-t="7" type="number" value="6" step="0.5" min="1"></td></tr>
<tr><td>T2</td><td><input class="tdia" data-t="2" type="number" value="8" step="0.5" min="1"></td><td>T8</td><td><input class="tdia" data-t="8" type="number" value="6" step="0.5" min="1"></td></tr>
<tr><td>T3</td><td><input class="tdia" data-t="3" type="number" value="10" step="0.5" min="1"></td><td>T9</td><td><input class="tdia" data-t="9" type="number" value="6" step="0.5" min="1"></td></tr>
<tr><td>T4</td><td><input class="tdia" data-t="4" type="number" value="12" step="0.5" min="1"></td><td>T10</td><td><input class="tdia" data-t="10" type="number" value="6" step="0.5" min="1"></td></tr>
<tr><td>T5</td><td><input class="tdia" data-t="5" type="number" value="6" step="0.5" min="1"></td><td>T11</td><td><input class="tdia" data-t="11" type="number" value="6" step="0.5" min="1"></td></tr>
<tr><td>T6</td><td><input class="tdia" data-t="6" type="number" value="6" step="0.5" min="1"></td><td>T12</td><td><input class="tdia" data-t="12" type="number" value="6" step="0.5" min="1"></td></tr>
</tbody></table></div></div>
<button class="btn btn-secondary btn-sm" id="btnApplyTools" style="margin-top:6px;width:100%">应用刀具设置</button>
</div>
<div class="panel-section"><h3>加工原点</h3>
<div class="origin-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
<button class="origin-btn" data-origin="top-left">TL</button>
<button class="origin-btn" data-origin="top-right">TR</button>
<button class="origin-btn active" data-origin="bottom-left">BL</button>
<button class="origin-btn" data-origin="bottom-right">BR</button>
</div>
</div>
<div class="panel-section"><h3>坐标翻转</h3>
<div class="flip-section">
<button id="btnFlipX" class="flip-btn"><span class="icon">⇄</span> 翻转X轴</button>
<button id="btnFlipY" class="flip-btn"><span class="icon">⇄</span> 翻转Y轴</button>
</div>
</div>

</div>
</div>
<div class="status-bar"><div class="status-left"><span class="status-dot idle" id="statusDot"></span><span id="statusText">就绪 - 请选择NC文件</span></div><span id="statusRight">CSG: 就绪</span></div>
</div><script type="importmap">

<script type="module">

// NC coordinate to Three.js position (accounting for origin quadrant)
function ncToThree(nx, ny, nz) {
  const w2 = S.bw / 2, l2 = S.bl / 2;
  let tx, tz;
  const ax = S.flipX ? -nx : nx;
  const ay = S.flipY ? -ny : ny;
  switch (S.origin) {
    case "bottom-left": tx = ax - w2; tz = ay - l2; break;
    case "bottom-right": tx = w2 - ax; tz = ay - l2; break;
    case "top-left": tx = ax - w2; tz = l2 - ay; break;
    case "top-right": tx = w2 - ax; tz = l2 - ay; break;
  }
  return new THREE.Vector3(tx, nz, tz);
}

let pathPts = [], pl = null, cl = [], cutLines = [];

function updL() {
  // Remove all existing path lines
  if (pl) { sc.remove(pl); pl.geometry.dispose(); pl.material.dispose(); pl = null; }
  cutLines.forEach(l => { sc.remove(l); if(l.geometry) l.geometry.dispose(); if(l.material) l.material.dispose(); });
  cutLines = [];
  // Build rapid line from all rapid points
  const rapPts = pathPts.filter(p => p.type === "rapid").map(p => p.pos);
  if (rapPts.length) {
    const g = new THREE.BufferGeometry().setFromPoints(rapPts);
    pl = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0x44FF44, transparent: true, opacity: 0.3 }));
    sc.add(pl);
  }
  // Build separate cut segments
  let seg = [];
  for (let i = 0; i < pathPts.length; i++) {
    const p = pathPts[i];
    if (p.type === "cut") {
      seg.push(p.pos);
    } else {
      // End of a cut segment
      if (seg.length > 1) {
        const g = new THREE.BufferGeometry().setFromPoints(seg);
        const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xff6644 }));
        sc.add(line);
        cutLines.push(line);
      }
      seg = [];
    }
  }
  // Don't forget last segment
  if (seg.length > 1) {
    const g = new THREE.BufferGeometry().setFromPoints(seg);
    const line = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xff6644 }));
    sc.add(line);
    cutLines.push(line);
  }
}

// 鈹€鈹€鈹€ CSG 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
const csgQ = [];
let csgB = false, csgN = 0;

function makeToolGeo(sx, sy, sz, ex, ey, ez, dia) {
  const r = Math.max(dia / 2, 0.5);
  const w2 = S.bw / 2, l2 = S.bl / 2;
  const asx = S.flipX ? -sx : sx;
  const aex = S.flipX ? -ex : ex;
  const asy = S.flipY ? -sy : sy;
  const aey = S.flipY ? -ey : ey;
  let gsx, gex, gsy, gey;
  switch (S.origin) {
    case "bottom-left": gsx = asx - w2; gex = aex - w2; gsy = asy - l2; gey = aey - l2; break;
    case "bottom-right": gsx = w2 - asx; gex = w2 - aex; gsy = asy - l2; gey = aey - l2; break;
    case "top-left": gsx = asx - w2; gex = aex - w2; gsy = l2 - asy; gey = l2 - aey; break;
    case "top-right": gsx = w2 - asx; gex = w2 - aex; gsy = l2 - asy; gey = l2 - aey; break;
  }
  const dx = gex - gsx, dy = gey - gsy;
  const xyLen = Math.sqrt(dx * dx + dy * dy);
  // Calculate actual cut depth from NC Z values
  // World y=nz, geometry space offset by mesh (bt/2 + S.zb): geom_y = nz - bt/2 - S.zb
  const halfBt = S.bt / 2;
  const toolDeepZ = Math.min(sz, ez);
  const geomDeep = toolDeepZ - halfBt - S.zb;
  const cutBottom = Math.max(-halfBt, geomDeep);
  const cutTop = halfBt;
  var cy = (cutTop + cutBottom) / 2;
  var toolHeight = cutTop - cutBottom;
  if (toolHeight < 0.01) return null;
  // Drill / plunge: small XY movement -> cylinder (non-indexed for CSG compatibility)
  if (xyLen < r * 0.8) {
    const g = new THREE.CylinderGeometry(r, r, toolHeight, 12);
    const ni2 = g.toNonIndexed();
    g.dispose();
    ni2.translate(gsx, cy, gsy);
    return ni2;
  }
  // Swept cut: box along XY path
  const totalLen = xyLen + r * 2;
  const cx = (gsx + gex) / 2;
  const cz = (gsy + gey) / 2;
  const g = new THREE.BoxGeometry(r * 2, toolHeight, totalLen);
  if (xyLen > 0.5) { g.rotateY(Math.atan2(dx, dy)); }
  g.translate(cx, cy, cz);
  return g;
}

async function runCSG() {
  if (csgB || csgQ.length === 0 || !bm) return;
  csgB = true;
  const batchSize = Math.min(csgQ.length, 50);
  const batch = csgQ.splice(0, batchSize);
  SR.textContent = "CSG: \u8ba1\u7b97\u4e2d...";
  await new Promise(r => setTimeout(r, 10));
  for (let ci = 0; ci < batch.length; ci++) {
    const c = batch[ci];
    try {
      const tGeo = makeToolGeo(c.sx, c.sy, c.sz, c.ex, c.ey, c.ez, c.dia);
      if (!tGeo || !tGeo.attributes || !tGeo.attributes.position) {
        if (tGeo && tGeo.disposeBoundsTree) tGeo.disposeBoundsTree();
        if (tGeo) tGeo.dispose();
        continue;
      }
      tGeo.computeBoundsTree();
      tGeo.computeVertexNormals();
      const boardGeo = bm.geometry.clone();
      if (boardGeo.disposeBoundsTree) boardGeo.disposeBoundsTree();
      boardGeo.computeBoundsTree();
      const tmpMat = new THREE.MeshBasicMaterial();
      const brushBoard = new Brush(boardGeo, tmpMat);
      const brushTool = new Brush(tGeo.clone(), tmpMat);
      const evaluator = new Evaluator();
      const result = evaluator.evaluate(brushBoard, brushTool, SUBTRACTION);
      tmpMat.dispose();
      // Clean up temporary geometries
      if (tGeo.disposeBoundsTree) tGeo.disposeBoundsTree();
      tGeo.dispose();
      brushBoard.geometry.dispose();
      brushTool.geometry.dispose();
      if (result && result.geometry) {
        const pos = result.geometry.attributes.position;
        if (pos && pos.count > 3) {
          result.geometry.computeVertexNormals();
          // \u5408\u5e76\u76f8\u90bb\u9876\u70b9\u4ee5\u51cf\u5c11\u590d\u6742\u5ea6
          try {
            const merged = mergeVertices(result.geometry, 0.01);
            result.geometry.dispose();
            merged.computeBoundsTree();
            merged.computeVertexNormals();
            const oldGeo = bm.geometry;
            bm.geometry = merged;
            if (oldGeo.disposeBoundsTree) oldGeo.disposeBoundsTree();
            oldGeo.dispose();
          } catch(e) {
            // fallback: use result directly without mergeVertices
            const oldGeo = bm.geometry;
            bm.geometry = result.geometry;
            if (oldGeo.disposeBoundsTree) oldGeo.disposeBoundsTree();
            oldGeo.dispose();
            bm.geometry.computeBoundsTree();
          }
          csgN++;
        }
      }
    } catch(e) { console.error("CSG error:", e.message || e); }
    if (ci < batch.length - 1) await new Promise(r => setTimeout(r, 5));
  }
  SR.textContent = "CSG: " + csgN + " \u6b21\u64cd\u4f5c";
  csgB = false;
  if (csgQ.length > 0) runCSG();
}

// Per-line CSG: process only the first queued operation for real-time feedback
async function runSingleCSG() {
  if (csgB || csgQ.length === 0 || !bm) return;
  csgB = true;
  const c = csgQ.shift();
  try {
    const tGeo = makeToolGeo(c.sx, c.sy, c.sz, c.ex, c.ey, c.ez, c.dia);
    if (!tGeo || !tGeo.attributes || !tGeo.attributes.position) {
      if (tGeo) { if (tGeo.disposeBoundsTree) tGeo.disposeBoundsTree(); tGeo.dispose(); }
      csgB = false; return;
    }
    tGeo.computeBoundsTree();
    tGeo.computeVertexNormals();
    const boardGeo = bm.geometry.clone();
    if (boardGeo.disposeBoundsTree) boardGeo.disposeBoundsTree();
    boardGeo.computeBoundsTree();
    const tmpMat = new THREE.MeshBasicMaterial();
    const brushBoard = new Brush(boardGeo, tmpMat);
    const brushTool = new Brush(tGeo.clone(), tmpMat);
    const evaluator = new Evaluator();
    const result = evaluator.evaluate(brushBoard, brushTool, SUBTRACTION);
    tmpMat.dispose();
    if (tGeo.disposeBoundsTree) tGeo.disposeBoundsTree();
    tGeo.dispose();
    brushBoard.geometry.dispose();
    brushTool.geometry.dispose();
    if (result && result.geometry) {
      const pos = result.geometry.attributes.position;
      if (pos && pos.count > 3) {
        result.geometry.computeVertexNormals();
        try {
          const merged = mergeVertices(result.geometry, 0.01);
          result.geometry.dispose();
          merged.computeBoundsTree();
          merged.computeVertexNormals();
          const oldGeo = bm.geometry;
          bm.geometry = merged;
          if (oldGeo.disposeBoundsTree) oldGeo.disposeBoundsTree();
          oldGeo.dispose();
        } catch(e) {
          bm.geometry = result.geometry;
          bm.geometry.computeBoundsTree();
        }
        csgN++;
      }
    }
  } catch(e) { console.error("CSG error:", e.message || e); }
  csgB = false;
  await new Promise(r => setTimeout(r, 0));
}

// 鈹€鈹€鈹€ NC Parser 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
function parse(t) {
  const bl = []; let ln = 0;
  const ls = t.split("\n");
  for (let i = 0; i < ls.length; i++) {
    ln++;
    let l = ls[i].replace(/\(.*?\)/g, "").replace(/;.*$/g, "").trim();
    if (!l) continue;
    l = l.replace(/^N\d+\s*/i, "");
    if (!l) continue;
    const b = { ln, g: [], m: [], t: null, x: null, y: null, z: null, i: null, j: null, mv: false };
    const ts = l.split(/\s+/);
    for (let ti = 0; ti < ts.length; ti++) {
      const c = ts[ti][0];
      const v = parseFloat(ts[ti].substring(1));
      if (isNaN(v)) continue;
      switch (c.toUpperCase()) {
        case "G": b.g.push(v); break;
        case "M": b.m.push(v); break;
        case "T": b.t = Math.floor(v); break;
        case "X": b.x = v; b.mv = true; break;
        case "Y": b.y = v; b.mv = true; break;
        case "Z": b.z = v; b.mv = true; break;
        case "I": b.i = v; break;
        case "J": b.j = v; break;
      }
    }
    bl.push(b);
  }
  return bl;
}

function ext(bl) {
  // cz stores raw (unadjusted) NC Z. nz = raw + S.bt is the Three.js Y position.
  const out = [];
  let cx = 0, cy = 0, cz = 0, ct2 = 0, g90 = true;
  for (let i = 0; i < bl.length; i++) {
    const b = bl[i];
    let isG90 = false, isG91 = false;
    for (let g of b.g) {
      if (g === 90) isG90 = true;
      else if (g === 91) isG91 = true;
    }
    if (isG90) g90 = true;
    if (isG91) g90 = false;
    if (b.t !== null) ct2 = b.t;
    const nx = g90 ? (b.x !== null ? b.x : cx) : (b.x !== null ? cx + b.x : cx);
    const ny = g90 ? (b.y !== null ? b.y : cy) : (b.y !== null ? cy + b.y : cy);
    // raw_z is the NC Z without board thickness offset
    const raw_z = g90 ? (b.z !== null ? b.z : cz) : (b.z !== null ? cz + b.z : cz);
    const nz = raw_z;  // Three.js Y = NC Z (Z=0 = grid/board surface level)
    const isArc = b.g.indexOf(2) >= 0 || b.g.indexOf(3) >= 0;
    const isG1 = b.g.indexOf(1) >= 0;
    if (b.mv) {
      // G0 = rapid (positioning), G1/G2/G3 = cut (feed)
      let mt = "rapid";
      if (isG1 || isArc) {
        mt = "cut";
      } else if (!b.g.length && b.mv) {
        // Blocks without G-code that have coordinates: check Z
        if (nz < 0) mt = "cut";
      }
      if (isArc && mt === "cut" && b.i !== null && b.j !== null) {
        // Arc interpolation: generate multiple linear segments
        const rArc = Math.sqrt(b.i * b.i + b.j * b.j);
        if (rArc > 0.01) {
          const cxa = cx + b.i;
          const cya = cy + b.j;
          const startA = Math.atan2(cy - cya, cx - cxa);
          const endA = Math.atan2(ny - cya, nx - cxa);
          const clockwise = b.g.indexOf(2) >= 0;
          let da = endA - startA;
          if (clockwise) {
            if (da > 0) da -= 2 * Math.PI;
          } else {
            if (da < 0) da += 2 * Math.PI;
          }
          const nSeg = Math.max(4, Math.ceil(Math.abs(da) / (Math.PI / 36)));
          for (let si = 1; si <= nSeg; si++) {
            const t2 = si / nSeg;
            const a = startA + da * t2;
            const pxa = cxa + rArc * Math.cos(a);
            const pya = cya + rArc * Math.sin(a);
            // Interpolate Z: start at old raw Z, end at new raw Z
            const pz_raw = cz + (raw_z - cz) * t2;
            const pz = pz_raw;
            const seg = { ln: b.ln, sx: 0, sy: 0, sz: 0, ex: pxa, ey: pya, ez: pz, mt: mt, tn: ct2 };
            if (si === 1) { seg.sx = cx; seg.sy = cy; seg.sz = cz; }
            else { seg.sx = out[out.length-1].ex; seg.sy = out[out.length-1].ey; seg.sz = out[out.length-1].ez; }
            out.push(seg);
          }
          cx = nx; cy = ny; cz = raw_z;
        } else {
          b.sx = cx; b.sy = cy; b.sz = cz;
          b.ex = nx; b.ey = ny; b.ez = nz;
          b.mt = mt; b.tn = ct2;
          out.push(b);
          cx = nx; cy = ny; cz = raw_z;
        }
      } else {
        b.sx = cx; b.sy = cy; b.sz = cz;
        b.ex = nx; b.ey = ny; b.ez = nz;
        b.mt = mt; b.tn = ct2;
        out.push(b);
        cx = nx; cy = ny; cz = raw_z;
      }
    } else {
      if (b.x !== null || b.y !== null || b.z !== null) { cx = nx; cy = ny; cz = raw_z; }
    }
  }
  return out;
}

// 鈹€鈹€鈹€ Simulation 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
let simT = null;

function rsSt() {
  S.idx = -1; S.tx = 0; S.ty = 0; S.tz = S.zb + S.bt + 50; S.ct = 0;
  pathPts = []; updL(); mvTool(); updP();
  CT.textContent = "T0 (--mm)";
}

function updP() {
  const total = S.tp.length || 1;
  const cur = Math.max(0, S.idx + 1);
  const pct = Math.min(100, (cur / total) * 100);
  PF.style.width = pct + "%";
  PT.textContent = cur + " / " + total + " (" + Math.round(pct) + "%)";
}

function stSim() {
  if (S.idx >= S.tp.length - 1) { S.idx = -1; pathPts = []; updL(); updP(); updateNcEditor(); }
  S.play = true; S.pause = false;
  BS.disabled = true; BP.disabled = false; BSt.disabled = false;
  BSF.disabled = true; BSB.disabled = true;
  st("\u8fd0\u884c\u4e2d...", "running"); nxBl();
}

function paSim() {
  S.play = false; S.pause = true;
  if (simT) { clearTimeout(simT); simT = null; }
  BS.disabled = false; BS.textContent = "\u7ee7\u7eed";
  BP.disabled = true; BSF.disabled = false; BSB.disabled = S.idx <= 0;
  st("\u5df2\u6682\u505c", "paused");
  if (csgQ.length > 0) runCSG();
}

function stpSim() {
  S.play = false; S.pause = false;
  if (simT) { clearTimeout(simT); simT = null; }
  rsSt(); makeBoard(); csgQ.length = 0; csgN = 0;
  SR.textContent = "CSG: \u5c31\u7eea";
  BS.disabled = !S.load; BS.textContent = "\u5f00\u59cb";
  BP.disabled = true; BSt.disabled = true;
  BSF.disabled = !S.load; BSB.disabled = true;
  updateNcEditor();
  st("\u5df2\u505c\u6b62", "idle");
}

function nxBl() {
  if (!S.play) return;
  S.idx++;
  if (S.idx >= S.tp.length) {
    S.play = false;
    BS.disabled = true; BP.disabled = true; BSF.disabled = true; BSB.disabled = false;
    st("\u6a21\u62df\u5b8c\u6210", "idle");
    S.tx = 0; S.ty = 0; S.tz = S.zb + S.bt + 50; mvTool();
    if (csgQ.length > 0) runCSG();
    return;
  }
  exBl(S.idx);
  updP();
  // Process CSG one operation at a time to show per-line cutting effect
  if (csgQ.length > 0 && !csgB) runSingleCSG();
  const delay = Math.max(10, Math.round(50 / S.spd));
  simT = setTimeout(nxBl, delay);
}

function exBl(idx) {
  const b = S.tp[idx];
  if (!b) return;
  if (b.tn) {
    S.ct = b.tn;
    const d = S.td[b.tn] || parseFloat(DTD.value) || 6;
    CT.textContent = "T" + b.tn + " (" + d + "mm)";
    mkTool();
  }
  // Store both start and end positions so vertical drill lines are visible
  const p1 = ncToThree(b.sx, b.sy, b.sz);
  const p2 = ncToThree(b.ex, b.ey, b.ez);
  if (b.mt === "cut") {
    pathPts.push({ pos: p1, type: "cut" });
    pathPts.push({ pos: p2, type: "cut" });
    const dia = S.td[b.tn] || parseFloat(DTD.value) || 6;
    csgQ.push({ sx: b.sx, sy: b.sy, sz: b.sz, ex: b.ex, ey: b.ey, ez: b.ez, dia });
  } else {
    pathPts.push({ pos: p1, type: "rapid" });
    pathPts.push({ pos: p2, type: "rapid" });
  }
  S.tx = b.ex; S.ty = b.ey; S.tz = b.ez;
  updL(); mvTool();
  CL.textContent = b.ln;
  updateNcEditor();
}

function sf() {
  if (!S.load || S.idx >= S.tp.length - 1) return;
  S.play = false;
  if (simT) { clearTimeout(simT); simT = null; }
  S.idx++; exBl(S.idx); updP();
  BSB.disabled = false;
  if (S.idx >= S.tp.length - 1) BSF.disabled = true;
  updateNcEditor();
  if (csgQ.length > 0) runCSG();
}

function sb() {
  if (!S.load || S.idx <= 0) return;
  S.play = false;
  if (simT) { clearTimeout(simT); simT = null; }
  const t = S.idx - 1;
  S.idx = -1; S.tx = 0; S.ty = 0; S.tz = 0; S.ct = 0;
  pathPts = []; updL(); mvTool(); makeBoard();
  csgQ.length = 0; csgN = 0; SR.textContent = "CSG: \u5c31\u7eea";
  for (let i = 0; i <= t; i++) {
    const b = S.tp[i]; if (!b) continue;
    if (b.tn) { S.ct = b.tn; mkTool(); }
    const ps = ncToThree(b.sx, b.sy, b.sz);
    const pe = ncToThree(b.ex, b.ey, b.ez);
    if (b.mt === "cut") {
      pathPts.push({ pos: ps, type: "cut" });
      pathPts.push({ pos: pe, type: "cut" });
      csgQ.push({ sx: b.sx, sy: b.sy, sz: b.sz, ex: b.ex, ey: b.ey, ez: b.ez, dia: S.td[b.tn] || parseFloat(DTD.value) || 6 });
    } else { 
      pathPts.push({ pos: ps, type: "rapid" });
      pathPts.push({ pos: pe, type: "rapid" });
    }
    S.tx = b.ex; S.ty = b.ey; S.tz = b.ez;
  }
  S.idx = t;
  updL(); mvTool();
  CL.textContent = S.tp[t] ? S.tp[t].ln : "-";
  updateNcEditor();
  updP();
  BSF.disabled = false; BSB.disabled = t <= 0;
  st("\u5df2\u56de\u9000\u5230\u7b2c" + (t + 1) + "\u6b65", "paused");
  if (csgQ.length > 0) runCSG();
}

// 鈹€鈹€鈹€ File loading 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
async function lf(file) {
  const t = await file.text();
  FI2.textContent = file.name + " (" + (t.length / 1024).toFixed(1) + " KB)";
  S.rawLines = t.split("\n");
  populateNcEditor();
  st("\u89e3\u6790\u4e2d...");
  S.nc = parse(t);
  S.tp = ext(S.nc);
  TL.textContent = S.tp.length; CL.textContent = "-";
  // Reset flip state on new file load
  S.flipX = false;
  S.flipY = false;
  makeAxisLabels();
  S.load = S.tp.length > 0;

  BS.disabled = !S.load; BSF.disabled = !S.load;
  BSB.disabled = true; BP.disabled = true; BSt.disabled = true;
  const used = {};
  S.tp.forEach(b => { if (b.tn) used[b.tn] = true; });
  for (let k in used) {
    if (!S.td[parseInt(k)]) {
      S.td[parseInt(k)] = parseFloat(DTD.value) || 6;
      const inp = document.querySelector(`.tdia[data-t="${k}"]`);
      if (inp) inp.value = S.td[parseInt(k)];
    }
  }
  rsSt(); makeBoard(); csgQ.length = 0; csgN = 0;
  SR.textContent = "CSG: \u5c31\u7eea";
  mvTool(); updL();
  if (S.tp.length > 0) {
    const f = S.tp[0];
    S.tx = f.sx || 0; S.ty = f.sy || 0; S.tz = f.sz || 0;
    mvTool();
  }
  st("\u5df2\u52a0\u8f7d " + file.name + " (" + S.tp.length + " \u884c)", "idle");
  sl(false);
}

  sl(true, "\u52a0\u8f7d\u4e2d...");
  await lf(f);
});

// NC 代码区点击跳转
NE.addEventListener("click", function(e) {
  const lineEl = e.target.closest(".nc-editor-line");
  if (!lineEl) return;
  const lineNum = parseInt(lineEl.dataset.line);
  if (!S.load || S.tp.length === 0) return;
  let targetIdx = -1;
  for (let i = 0; i < S.tp.length; i++) {
    if (S.tp[i].ln === lineNum) { targetIdx = i; break; }
  }
  if (targetIdx < 0) return;
  S.play = false;
  if (simT) { clearTimeout(simT); simT = null; }
  S.idx = -1; S.tx = 0; S.ty = 0; S.tz = 0; S.ct = 0;
  pathPts = []; updL(); mvTool(); makeBoard();
  csgQ.length = 0; csgN = 0; SR.textContent = "CSG: 就绪";
  for (let i = 0; i <= targetIdx; i++) {
    const b = S.tp[i]; if (!b) continue;
    if (b.tn) { S.ct = b.tn; mkTool(); }
    const ps = ncToThree(b.sx, b.sy, b.sz);
    const pe = ncToThree(b.ex, b.ey, b.ez);
    if (b.mt === "cut") {
      pathPts.push({ pos: ps, type: "cut" });
      pathPts.push({ pos: pe, type: "cut" });
      csgQ.push({ sx: b.sx, sy: b.sy, sz: b.sz, ex: b.ex, ey: b.ey, ez: b.ez, dia: S.td[b.tn] || parseFloat(DTD.value) || 6 });
    } else { 
      pathPts.push({ pos: ps, type: "rapid" });
      pathPts.push({ pos: pe, type: "rapid" });
    }
    S.tx = b.ex; S.ty = b.ey; S.tz = b.ez;
  }
  S.idx = targetIdx;
  updL(); mvTool();
  CL.textContent = S.tp[targetIdx] ? S.tp[targetIdx].ln : "-";
  updateNcEditor();
  updP();
  BS.disabled = false; BSF.disabled = targetIdx >= S.tp.length - 1;
  BSB.disabled = targetIdx <= 0; BP.disabled = true; BSt.disabled = true;
  st("已跳转至第" + (targetIdx + 1) + "步", "paused");
  if (csgQ.length > 0) runCSG();
});
